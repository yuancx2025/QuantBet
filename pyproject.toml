[project]
name = "quantbet-nba"
version = "0.1.0"
description = "Limit-order mispricing research on NBA prediction markets"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
    "plotly>=5.24",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
    "tenacity>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantbet_nba"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
